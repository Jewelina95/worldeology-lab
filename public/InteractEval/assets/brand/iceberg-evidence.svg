<svg viewBox="0 0 405 365" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">The words are visible. The situation needs evidence.</title><desc id="desc">An observed acknowledgment sits above the water. Understanding, trust and goals below the surface are revisable estimates, linked to evidence across turns.</desc>
