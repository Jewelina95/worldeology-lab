<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">State: the information beneath a reply</title>
  <desc id="desc">An illustrative reply floats above a waterline. The larger submerged part of an iceberg represents goals, beliefs, and constraints that remain open to interpretation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#284b36" flood-opacity=".07" />
    </filter>
    <clipPath id="frame">
      <rect width="640" height="440" rx="18" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="440" fill="#f0f2e9" />
    <circle cx="559" cy="57" r="80" fill="#e6ecdd" opacity=".55" />
    <path d="M0 194C99 185 150 205 238 196S409 183 487 195 580 200 640 190V440H0Z" fill="#dce8df" />
    <path d="m209 193 61-72 58 72" fill="#fcfcf6" />
    <path d="m270 121 19 72h39Z" fill="#dce6d8" />
    <path d="m172 201 192 0-88 191Z" fill="#d4e2d6" />
    <path d="m172 201 102 34 2 157Z" fill="#d0dfd3" />
    <path d="m274 235 90-34-88 191Z" fill="#a5c1af" opacity=".65" />
    <path d="m172 201 115 0-13 34Z" fill="#edf3e9" />
    <path d="M0 194C99 185 150 205 238 196S409 183 487 195 580 200 640 190" fill="none" stroke="#81a58e" stroke-width="1.8" />
    <g filter="url(#shadow)">
      <path d="M86 43h259a17 17 0 0 1 17 17v50a17 17 0 0 1-17 17H168l-20 20 2-20H86a17 17 0 0 1-17-17V60a17 17 0 0 1 17-17Z" fill="#fcfcf7" />
      <text x="94" y="96" fill="#294a35" font-family="Georgia,serif" font-size="31">“That could work.”</text>
    </g>
    <text x="427" y="98" fill="#73836f" font-family="Arial,sans-serif" font-size="18">The words we hear</text>
    <g font-family="Arial,sans-serif" font-size="21" fill="#3e604b">
      <circle cx="420" cy="259" r="4" fill="#7b9d84" />
      <text x="437" y="266" font-family="Arial,sans-serif" font-size="21" fill="#3e604b">Goals</text>
      <circle cx="420" cy="303" r="4" fill="#7b9d84" />
      <text x="437" y="310" font-family="Arial,sans-serif" font-size="21" fill="#3e604b">Beliefs</text>
      <circle cx="420" cy="347" r="4" fill="#7b9d84" />
      <text x="437" y="354" font-family="Arial,sans-serif" font-size="21" fill="#3e604b">Constraints</text>
    </g>
    <text x="39" y="257" fill="#6b8775" font-family="Georgia,serif" font-size="21" font-style="italic">Still partly</text>
    <text x="39" y="285" fill="#6b8775" font-family="Georgia,serif" font-size="21" font-style="italic">unknown</text>
    <text x="39" y="414" fill="#6e8273" font-family="Arial,sans-serif" font-size="17">Interpretations can change with new evidence.</text>
  </g>
</svg>